name: GeniusSwitcher
options:
  bundleIdPrefix: com.dmemruk
  developmentLanguage: ru
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "13"
    # No Apple Developer account: ad-hoc signing, no hardened runtime (scripts/install.sh re-signs
    # with the local certificate so the Input Monitoring permission survives rebuilds).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  GeniusSwitcher:
    type: application
    platform: macOS
    sources:
      - GeniusSwitcher
    info:
      path: GeniusSwitcher/Info.plist
      properties:
        CFBundleDisplayName: Genius Switcher
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        # Menu bar only, no Dock icon.
        LSUIElement: true
    settings:
      base:
        # The app is "Genius Switcher.app"; the module and folder have no space.
        PRODUCT_NAME: Genius Switcher
        PRODUCT_MODULE_NAME: GeniusSwitcher
        PRODUCT_BUNDLE_IDENTIFIER: com.dmemruk.GeniusSwitcher
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - GeniusSwitcherTests
  # Unit tests of the pure logic: word tracking, rewrites and the detector.
  GeniusSwitcherTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/GeniusSwitcherTests
    dependencies:
      - target: GeniusSwitcher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmemruk.GeniusSwitcherTests
        # The app is "Genius Switcher.app" (PRODUCT_NAME); xcodegen would point at GeniusSwitcher.app.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Genius Switcher.app/Contents/MacOS/Genius Switcher"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
