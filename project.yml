name: GeniusTyper
options:
  bundleIdPrefix: com.dmemruk
  developmentLanguage: ru
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.11.0"
    CURRENT_PROJECT_VERSION: "15"
    # No Apple Developer account: ad-hoc signing, no hardened runtime (scripts/install.sh re-signs
    # with the local certificate so the Input Monitoring permission survives rebuilds).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  GeniusTyper:
    type: application
    platform: macOS
    sources:
      - GeniusTyper
    info:
      path: GeniusTyper/Info.plist
      properties:
        CFBundleDisplayName: Genius Typer
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        # Menu bar only, no Dock icon.
        LSUIElement: true
    settings:
      base:
        # The app is "Genius Typer.app"; the module and folder have no space.
        PRODUCT_NAME: Genius Typer
        PRODUCT_MODULE_NAME: GeniusTyper
        PRODUCT_BUNDLE_IDENTIFIER: com.dmemruk.GeniusTyper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - GeniusTyperTests
  # Unit tests of the pure logic: word tracking, rewrites and the detector.
  GeniusTyperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/GeniusTyperTests
    dependencies:
      - target: GeniusTyper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmemruk.GeniusTyperTests
        # The app is "Genius Typer.app" (PRODUCT_NAME); xcodegen would point at GeniusTyper.app.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Genius Typer.app/Contents/MacOS/Genius Typer"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
